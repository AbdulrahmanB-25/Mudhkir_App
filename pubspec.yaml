name: mudhkir_app
description: "Mudhkir (مُذكِّر) – an offline-first, Arabic medication reminder app with caregiver support."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App architecture
  provider: ^6.1.5+1
  go_router: ^18.0.2

  # Local database (the source of truth on the phone)
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.5

  # Cloud (optional): auth, backup/sync and companions
  supabase_flutter: ^2.18.0
  connectivity_plus: ^7.3.1

  # Reminders and background work
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10

  # UI
  intl: ^0.20.3
  table_calendar: ^3.3.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/medicines/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
